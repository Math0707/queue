# Perfil produção / Docker: PostgreSQL (variáveis de ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/queue}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:queue}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:queue}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false

# Para deploy real, prefira Flyway/Liquibase em vez de update
spring.jpa.hibernate.ddl-auto=update
