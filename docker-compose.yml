services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queue
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/queue
      SPRING_DATASOURCE_USERNAME: queue
      SPRING_DATASOURCE_PASSWORD: queue
    ports:
      - "8080:8080"

volumes:
  pgdata:
